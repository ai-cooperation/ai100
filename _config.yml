title: "AI 100 講"
description: "iPAS AI 應用規劃師導向 — 10 模組 × 10 講，白話解說 + 視覺圖解"
url: "https://ai100.cooperation.tw"
baseurl: ""
lang: "zh-TW"

collections:
  lectures:
    output: true
    permalink: /lectures/:name/
    sort_by: number

defaults:
  - scope:
      path: ""
      type: "lectures"
    values:
      layout: "lecture"
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"

include:
  - slides/pdf

exclude:
  - scripts/
  - "*.py"
  - classroom/ARCHITECTURE.md
  - classroom/classroom_agent.py
  - classroom/assistant.py
  - README.md
  - node_modules/
  - package.json
  - package-lock.json

markdown: kramdown
kramdown:
  input: GFM
