<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 課堂互動</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--pri:#0F9D8A;--pri-d:#0A7A6B;--navy:#0B3C5D;--gold:#FFC857;--red:#DC2626;--purple:#7C3AED;--bg:#F5F7FA;--surface:#fff;--text:#1A1A1A;--dim:#5A6B7A;--border:#e5e7eb}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--text)}
  button{font-family:inherit;cursor:pointer;border:none} input,textarea{font-family:inherit}

  .join-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
  .join-box{background:var(--surface);border-radius:16px;padding:2.5rem;width:min(380px,100%);box-shadow:0 4px 24px rgba(0,0,0,0.08);text-align:center}
  .join-box h1{font-size:1.5rem;color:var(--navy);margin-bottom:0.3rem}
  .join-box .sub{color:var(--dim);font-size:0.85rem;margin-bottom:1.5rem}
  .join-box input{width:100%;padding:0.8rem 1rem;border:2px solid var(--border);border-radius:10px;font-size:1rem;outline:none;transition:border-color 0.2s;margin-bottom:0.8rem}
  .join-box input:focus{border-color:var(--pri)}
  .btn-join{width:100%;padding:0.9rem;background:var(--pri);color:#fff;font-size:1.05rem;font-weight:700;border-radius:10px}
  .btn-join:disabled{opacity:0.5}

  .app{display:none;flex-direction:column;height:100vh}
  .app.active{display:flex}
  .topbar{background:var(--navy);color:#fff;padding:0.6rem 1rem;display:flex;align-items:center;gap:0.5rem;flex-shrink:0}
  .topbar .room-name{font-size:0.8rem;color:var(--gold);font-weight:700}
  .topbar .mode-label{font-size:0.85rem;margin-left:auto}
  .topbar .ai-badge{font-size:0.65rem;background:var(--purple);padding:0.1rem 0.4rem;border-radius:4px;margin-left:0.3rem}
  .topbar .online{font-size:0.7rem;color:rgba(255,255,255,0.5);margin-left:0.3rem}

  .content{flex:1;overflow-y:auto;padding:0.8rem;-webkit-overflow-scrolling:touch}

  /* Wall */
  .msg{background:var(--surface);border-radius:10px;padding:0.8rem 1rem;margin-bottom:0.5rem;box-shadow:0 1px 4px rgba(0,0,0,0.05);animation:msgIn 0.3s}
  .msg.ai{background:#EDE9FE;border-left:3px solid var(--purple)}
  .msg.teacher{background:#FEF3C7;border-left:3px solid var(--gold)}
  @keyframes msgIn{from{opacity:0;transform:translateY(10px)}}
  .msg-name{font-size:0.75rem;font-weight:700;color:var(--pri)}
  .msg-name.ai{color:var(--purple)} .msg-name.teacher{color:var(--gold)}
  .msg-text{font-size:0.95rem;margin-top:0.2rem;line-height:1.5;word-break:break-word;white-space:pre-wrap}
  .msg-time{font-size:0.65rem;color:var(--dim);margin-top:0.2rem}
  .input-bar{display:flex;gap:0.5rem;padding:0.6rem 0.8rem;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
  .input-bar input{flex:1;padding:0.7rem 1rem;border:2px solid var(--border);border-radius:24px;font-size:0.95rem;outline:none}
  .input-bar input:focus{border-color:var(--pri)}
  .input-bar button{width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;font-size:1.2rem;flex-shrink:0}
  .input-bar button:disabled{opacity:0.4}

  /* Vote */
  .vote-question{font-size:1.2rem;font-weight:700;color:var(--navy);text-align:center;padding:1.5rem 1rem 1rem}
  .vote-option{display:block;width:100%;padding:1rem;margin-bottom:0.6rem;background:var(--surface);border:2px solid var(--border);border-radius:12px;font-size:1rem;text-align:left;transition:all 0.2s}
  .vote-option.selected{border-color:var(--pri);background:#D4F0EB}
  .vote-option.disabled{opacity:0.7}
  .vote-bar{height:6px;background:var(--border);border-radius:3px;margin-top:0.5rem;overflow:hidden}
  .vote-bar .fill{height:100%;background:var(--pri);border-radius:3px;transition:width 0.6s}
  .vote-result{font-size:0.8rem;color:var(--dim);margin-top:0.3rem}
  .voted-badge{text-align:center;margin-top:1rem;color:var(--pri);font-weight:700}

  /* QA */
  .qa-card{background:var(--surface);border-radius:10px;padding:0.8rem 1rem;margin-bottom:0.6rem;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
  .qa-top{display:flex;gap:0.6rem;align-items:flex-start}
  .qa-up{display:flex;flex-direction:column;align-items:center;min-width:36px}
  .qa-up button{width:32px;height:32px;border-radius:8px;background:var(--bg);color:var(--dim);font-size:0.9rem;border:1px solid var(--border)}
  .qa-up button.voted{background:var(--pri);color:#fff;border-color:var(--pri)}
  .qa-up .count{font-size:0.75rem;font-weight:700;color:var(--navy);margin-top:0.15rem}
  .qa-body .qa-text{font-size:0.95rem;line-height:1.5}
  .qa-body .qa-meta{font-size:0.7rem;color:var(--dim);margin-top:0.2rem}
  /* Replies */
  .qa-replies{margin-top:0.5rem;padding-top:0.4rem;border-top:1px solid var(--border)}
  .qa-reply{padding:0.4rem 0.6rem;margin-bottom:0.3rem;border-radius:6px;font-size:0.85rem;line-height:1.4;white-space:pre-wrap}
  .qa-reply.ai{background:#EDE9FE;border-left:2px solid var(--purple)}
  .qa-reply.teacher{background:#FEF3C7;border-left:2px solid var(--gold)}
  .qa-reply .rp-name{font-size:0.7rem;font-weight:700;margin-bottom:0.15rem}
  .qa-reply .rp-name.ai{color:var(--purple)} .qa-reply .rp-name.teacher{color:var(--gold)}

  .qa-input{display:flex;gap:0.5rem;padding:0.6rem 0.8rem;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
  .qa-input textarea{flex:1;padding:0.7rem 1rem;border:2px solid var(--border);border-radius:12px;font-size:0.95rem;outline:none;resize:none;height:44px}
  .qa-input button{padding:0 1.2rem;border-radius:12px;background:var(--pri);color:#fff;font-size:0.9rem;font-weight:700}
  .qa-input button:disabled{opacity:0.4}

  .pause-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dim)}
  .pause-screen .icon{font-size:3rem;margin-bottom:1rem;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}

  .hidden{display:none!important}
  .error-msg{color:var(--red);font-size:0.8rem;text-align:center;margin-top:0.5rem}
</style>
</head>
<body>

<div class="join-screen" id="joinScreen">
  <div class="join-box">
    <h1>AI 課堂互動</h1>
    <p class="sub">掃描 QR Code 或輸入房間代碼加入</p>
    <input type="text" id="inputRoom" placeholder="房間代碼" autocomplete="off">
    <input type="text" id="inputName" placeholder="你的暱稱" autocomplete="off" maxlength="20">
    <input type="password" id="inputPassword" placeholder="房間密碼" autocomplete="off" class="hidden">
    <button class="btn-join" id="btnJoin" onclick="joinRoom()">加入課堂</button>
    <p class="error-msg hidden" id="joinError"></p>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <span class="room-name" id="dispRoom"></span>
    <span class="mode-label" id="dispMode"></span>
    <span class="ai-badge hidden" id="aiBadge">🤖 AI</span>
    <span class="online" id="dispOnline"></span>
  </div>
  <div class="content hidden" id="wallContent"></div>
  <div class="input-bar hidden" id="wallInput">
    <input type="text" id="wallText" placeholder="輸入訊息..." maxlength="500" autocomplete="off">
    <button id="wallSendBtn" onclick="sendMessage()">↑</button>
  </div>
  <div class="content hidden" id="voteContent"></div>
  <div class="content hidden" id="qaContent"></div>
  <div class="qa-input hidden" id="qaInput">
    <textarea id="qaText" placeholder="提出你的問題..." maxlength="300"></textarea>
    <button id="qaSendBtn" onclick="sendQuestion()">發問</button>
  </div>
  <div class="content hidden" id="pauseContent"><div class="pause-screen"><div class="icon">⏳</div><p>老師準備中，請稍候...</p></div></div>
  <div class="content hidden" id="feedbackContent"><div class="pause-screen"><div class="icon" style="animation:none">💬</div><p style="font-weight:700;color:#7C3AED">課程結束！感謝你的參與</p><p style="font-size:0.85rem;color:#7d8590;margin-top:0.5rem">請花 2 分鐘給老師回饋</p><a id="feedbackLink" href="#" style="display:inline-block;margin-top:1rem;padding:0.8rem 2rem;background:#7C3AED;color:#fff;border-radius:10px;font-weight:700;text-decoration:none;font-size:1rem">開始回饋 →</a></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:['AIza','SyC5X5C0Uje6bCMzrvuUuq5Bz33ly0PR-vc'].join(''),
  authDomain:'ai-classroom-70a97.firebaseapp.com',
  databaseURL:'https://ai-classroom-70a97-default-rtdb.firebaseio.com',
  projectId:'ai-classroom-70a97',
  storageBucket:'ai-classroom-70a97.firebasestorage.app',
  appId:'1:160782638499:web:f3fb834ce32d643de28e16',
});
const db=firebase.database();
let roomId='',userName='',odID='',currentMode='pause',myVote=null,myQaUps={},listeners=[];
let lastSendTime=0;const COOLDOWN=3000;

(function(){
  const p=new URLSearchParams(location.search),r=p.get('room');
  if(r)document.getElementById('inputRoom').value=r;
  odID=localStorage.getItem('_odid')||(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));
  localStorage.setItem('_odid',odID);
  const n=localStorage.getItem('_name');if(n)document.getElementById('inputName').value=n;
  document.getElementById('inputRoom').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('inputName').focus()});
  document.getElementById('inputName').addEventListener('keydown',e=>{if(e.key==='Enter'){const pw=document.getElementById('inputPassword');!pw.classList.contains('hidden')?pw.focus():joinRoom()}});
  document.getElementById('inputPassword').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom()});
  document.getElementById('wallText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
})();

function joinRoom(){
  const room=document.getElementById('inputRoom').value.trim(),name=document.getElementById('inputName').value.trim()||'匿名';
  if(!room){showError('請輸入房間代碼');return}
  roomId=room;userName=name;localStorage.setItem('_name',name);
  document.getElementById('btnJoin').disabled=true;
  db.ref(`rooms/${roomId}/config`).once('value').then(s=>{
    if(!s.exists()){showError('找不到這個房間');document.getElementById('btnJoin').disabled=false;return}
    const c=s.val();
    if(c.password){const pf=document.getElementById('inputPassword');if(pf.classList.contains('hidden')){pf.classList.remove('hidden');pf.focus();document.getElementById('btnJoin').disabled=false;return}if(pf.value!==c.password){showError('密碼錯誤');document.getElementById('btnJoin').disabled=false;return}}
    enterRoom();
  }).catch(e=>{showError('連線失敗：'+e.message);document.getElementById('btnJoin').disabled=false});
}
function showError(m){const e=document.getElementById('joinError');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3000)}

function enterRoom(){
  document.getElementById('joinScreen').style.display='none';
  document.getElementById('app').classList.add('active');
  document.getElementById('dispRoom').textContent=roomId;
  const pr=db.ref(`rooms/${roomId}/presence/${odID}`);
  db.ref('.info/connected').on('value',s=>{if(s.val()){pr.onDisconnect().remove();pr.set({name:userName,ts:firebase.database.ServerValue.TIMESTAMP})}});
  db.ref(`rooms/${roomId}/presence`).on('value',s=>{document.getElementById('dispOnline').textContent=`${s.numChildren()}人`});
  db.ref(`rooms/${roomId}/config/aiEnabled`).on('value',s=>{document.getElementById('aiBadge').classList.toggle('hidden',!s.val())});
  db.ref(`rooms/${roomId}/config/mode`).on('value',s=>{switchMode(s.val()||'pause')});
}

const modeNames={wall:'💬 訊息牆',vote:'📊 投票',qa:'❓ 問答',pause:'⏸ 等待中'};
function switchMode(m){
  if(m===currentMode&&!document.getElementById(m+'Content')?.classList.contains('hidden'))return;
  currentMode=m;document.getElementById('dispMode').textContent=modeNames[m]||m;
  ['wallContent','wallInput','voteContent','qaContent','qaInput','pauseContent','feedbackContent'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  listeners.filter(l=>l.c).forEach(l=>l.ref.off(l.event));listeners=listeners.filter(l=>!l.c);
  if(m==='wall')showWall();else if(m==='vote')showVote();else if(m==='qa')showQA();
  else if(m==='feedback'){
    document.getElementById('feedbackContent').classList.remove('hidden');
    document.getElementById('feedbackLink').href=`/classroom/feedback?room=${roomId}`;
  }
  else document.getElementById('pauseContent').classList.remove('hidden');
}

function canSend(){return Date.now()-lastSendTime>=COOLDOWN}
function startCD(id){lastSendTime=Date.now();const b=document.getElementById(id);if(b){b.disabled=true;setTimeout(()=>{b.disabled=false},COOLDOWN)}}

// Wall
function showWall(){
  const el=document.getElementById('wallContent');el.classList.remove('hidden');el.innerHTML='';
  document.getElementById('wallInput').classList.remove('hidden');
  const ref=db.ref(`rooms/${roomId}/wall`).orderByChild('ts').limitToLast(100);
  ref.on('child_added',s=>{const d=s.val(),r=d.role||'student';const div=document.createElement('div');
    div.className=`msg ${r}`;const icon=r==='ai'?'🤖 ':r==='teacher'?'👨‍🏫 ':'';
    div.innerHTML=`<div class="msg-name ${r}">${icon}${esc(d.name)}</div><div class="msg-text">${esc(d.text)}</div><div class="msg-time">${timeStr(d.ts)}</div>`;
    el.appendChild(div);el.scrollTop=el.scrollHeight});
  listeners.push({ref,event:'child_added',c:true});
}
function sendMessage(){if(!canSend())return;const i=document.getElementById('wallText'),t=i.value.trim();if(!t||!roomId)return;i.value='';i.focus();startCD('wallSendBtn');
  db.ref(`rooms/${roomId}/wall`).push({text:t,name:userName,role:'student',ts:firebase.database.ServerValue.TIMESTAMP}).catch(e=>alert('發送失敗：'+e.message))}

// Vote
function showVote(){const el=document.getElementById('voteContent');el.classList.remove('hidden');myVote=null;
  const ref=db.ref(`rooms/${roomId}/currentVote`);ref.on('value',s=>{const d=s.val();if(!d){el.innerHTML='<div class="pause-screen"><p>尚未開始投票</p></div>';return}renderVote(el,d)});
  listeners.push({ref,event:'value',c:true})}
function renderVote(el,data){const vid=data.id,opts=data.options||[];
  db.ref(`rooms/${roomId}/votes/${vid}/${odID}`).once('value').then(s=>{myVote=s.exists()?s.val():null;
    const vr=db.ref(`rooms/${roomId}/votes/${vid}`);vr.on('value',rs=>{const R=rs.val()||{},C={};let T=0;
      opts.forEach((_,i)=>C[i]=0);Object.entries(R).forEach(([k,v])=>{if(typeof v==='number'){C[v]=(C[v]||0)+1;T++}});
      let h=`<div class="vote-question">${esc(data.question)}</div><div style="padding:0 0.8rem">`;
      opts.forEach((o,i)=>{const p=T?Math.round(C[i]/T*100):0,sl=myVote===i?' selected':'',ds=myVote!==null?' disabled':'';
        h+=`<button class="vote-option${sl}${ds}" onclick="castVote('${vid}',${i})" ${myVote!==null?'disabled':''}>${esc(o)}${myVote!==null?`<div class="vote-bar"><div class="fill" style="width:${p}%"></div></div><div class="vote-result">${p}% (${C[i]}票)</div>`:''}</button>`});
      if(myVote!==null)h+='<div class="voted-badge">已投票</div>';h+='</div>';el.innerHTML=h});
    listeners.push({ref:vr,event:'value',c:true})})
}
function castVote(vid,i){if(myVote!==null)return;myVote=i;db.ref(`rooms/${roomId}/votes/${vid}/${odID}`).set(i)}

// QA with replies
function showQA(){
  const el=document.getElementById('qaContent');el.classList.remove('hidden');
  document.getElementById('qaInput').classList.remove('hidden');
  myQaUps={};
  db.ref(`rooms/${roomId}/qaUps`).once('value').then(s=>{const d=s.val()||{};Object.keys(d).forEach(q=>{if(d[q][odID])myQaUps[q]=true})});
  const ref=db.ref(`rooms/${roomId}/qa`);
  ref.on('value',snap=>{
    const items=[];snap.forEach(c=>items.push({id:c.key,...c.val()}));
    items.sort((a,b)=>(b.ups||0)-(a.ups||0));
    // Fetch replies
    db.ref(`rooms/${roomId}/qaReplies`).once('value').then(rs=>{
      const allR=rs.val()||{};
      el.innerHTML=items.map(q=>{
        const replies=allR[q.id]?Object.values(allR[q.id]).sort((a,b)=>a.ts-b.ts):[];
        let rh=replies.map(r=>`<div class="qa-reply ${r.role}"><div class="rp-name ${r.role}">${r.role==='ai'?'🤖 AI 助教':'👨‍🏫 '+(r.name||'老師')}</div>${esc(r.text)}</div>`).join('');
        return `<div class="qa-card"><div class="qa-top">
          <div class="qa-up"><button class="${myQaUps[q.id]?'voted':''}" onclick="upQ('${q.id}')">▲</button><span class="count">${q.ups||0}</span></div>
          <div class="qa-body"><div class="qa-text">${esc(q.text)}</div><div class="qa-meta">${esc(q.name)} · ${timeStr(q.ts)}</div></div>
        </div>${rh?`<div class="qa-replies">${rh}</div>`:''}</div>`;
      }).join('');
    });
  });
  listeners.push({ref,event:'value',c:true});
}
function sendQuestion(){if(!canSend())return;const i=document.getElementById('qaText'),t=i.value.trim();if(!t||!roomId)return;i.value='';i.focus();startCD('qaSendBtn');
  db.ref(`rooms/${roomId}/qa`).push({text:t,name:userName,role:'student',ts:firebase.database.ServerValue.TIMESTAMP,ups:0}).catch(e=>alert('發送失敗：'+e.message))}
function upQ(qid){if(myQaUps[qid])return;myQaUps[qid]=true;db.ref(`rooms/${roomId}/qa/${qid}/ups`).transaction(v=>(v||0)+1);db.ref(`rooms/${roomId}/qaUps/${qid}/${odID}`).set(true)}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function timeStr(t){if(!t)return '';const d=new Date(t);return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`}
</script>
</body>
</html>
