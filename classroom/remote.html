<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>簡報遙控器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--pri:#0F9D8A;--navy:#0B3C5D;--gold:#FFC857;--purple:#7C3AED;--bg:#0d1117;--surface:#161b22;--text:#e6edf3;--dim:#7d8590;--border:#30363d}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none}
  button{font-family:inherit;cursor:pointer;border:none}

  /* Login */
  .login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
  .login-box{background:var(--surface);border-radius:16px;padding:2rem;width:min(360px,100%);border:1px solid var(--border);text-align:center}
  .login-box h1{font-size:1.3rem;color:var(--gold);margin-bottom:0.3rem}
  .login-box .sub{color:var(--dim);font-size:0.8rem;margin-bottom:1.5rem}
  .btn-g{display:flex;align-items:center;justify-content:center;gap:0.6rem;width:100%;padding:0.8rem;background:#fff;color:#333;font-size:0.95rem;font-weight:700;border-radius:10px}
  .btn-g img{width:18px;height:18px}

  /* Setup */
  .setup{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
  .setup-box{background:var(--surface);border-radius:16px;padding:2rem;width:min(360px,100%);border:1px solid var(--border);text-align:center}
  .setup-box input{width:100%;padding:0.8rem;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;outline:none;margin-bottom:0.8rem;text-align:center}
  .setup-box button{width:100%;padding:0.8rem;background:var(--pri);color:#fff;font-size:1rem;font-weight:700;border-radius:10px}

  /* Remote */
  .remote{display:none;flex-direction:column;height:100vh}
  .remote.active{display:flex}

  .r-header{background:var(--surface);padding:0.6rem 1rem;border-bottom:1px solid var(--border);text-align:center;flex-shrink:0}
  .r-header .room{font-size:0.75rem;color:var(--gold)}
  .r-current{font-size:1rem;font-weight:700;margin-top:0.2rem;color:var(--text)}
  .r-counter{font-size:0.7rem;color:var(--dim);margin-top:0.15rem}

  /* Nav buttons */
  .r-nav{display:flex;gap:1rem;padding:1rem;flex-shrink:0}
  .r-nav button{flex:1;height:80px;border-radius:16px;font-size:2rem;font-weight:900;transition:all 0.15s}
  .r-nav button:active{transform:scale(0.95)}
  .btn-prev{background:var(--surface);color:var(--text);border:2px solid var(--border)}
  .btn-next{background:var(--pri);color:#fff}

  /* Sections list */
  .r-sections{flex:1;overflow-y:auto;padding:0.5rem 1rem;-webkit-overflow-scrolling:touch}
  .r-sec{display:flex;align-items:center;gap:0.6rem;padding:0.7rem 0.8rem;margin-bottom:0.4rem;background:var(--surface);border-radius:10px;border:1px solid var(--border);transition:all 0.2s}
  .r-sec:active{transform:scale(0.98)}
  .r-sec.current{border-color:var(--pri);background:#0a2a22}
  .r-sec .idx{width:28px;height:28px;border-radius:50%;background:var(--bg);color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0}
  .r-sec.current .idx{background:var(--pri);color:#fff}
  .r-sec .title{font-size:0.85rem;color:var(--text)}

  /* Mode bar */
  .r-modes{display:flex;gap:0.5rem;padding:0.6rem 1rem;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
  .r-mode{flex:1;padding:0.5rem;border-radius:8px;font-size:0.75rem;font-weight:700;text-align:center;background:var(--bg);color:var(--dim);border:1px solid var(--border)}
  .r-mode.active{background:var(--pri);color:#fff;border-color:var(--pri)}

  .hidden{display:none!important}
</style>
</head>
<body>

<div class="login" id="loginScreen">
  <div class="login-box">
    <h1>簡報遙控器</h1>
    <p class="sub">老師用手機控制簡報 + 課堂模式</p>
    <button class="btn-g" onclick="googleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">Google 登入
    </button>
  </div>
</div>

<div class="setup hidden" id="setupScreen">
  <div class="setup-box">
    <h1 style="color:var(--gold);margin-bottom:1rem">選擇房間</h1>
    <input type="text" id="inputRoom" placeholder="房間代碼">
    <button onclick="enterRemote()">進入遙控</button>
  </div>
</div>

<div class="remote" id="remote">
  <div class="r-header">
    <div class="room" id="rRoom"></div>
    <div class="r-current" id="rCurrent">-</div>
    <div class="r-counter" id="rCounter">- / -</div>
  </div>
  <div class="r-nav">
    <button class="btn-prev" onclick="slideNav(-1)">←</button>
    <button class="btn-next" onclick="slideNav(1)">→</button>
  </div>
  <div class="r-sections" id="rSections"></div>
  <div class="r-modes">
    <button class="r-mode" data-mode="wall" onclick="setMode('wall')">💬</button>
    <button class="r-mode" data-mode="vote" onclick="setMode('vote')">📊</button>
    <button class="r-mode" data-mode="qa" onclick="setMode('qa')">❓</button>
    <button class="r-mode" data-mode="pause" onclick="setMode('pause')">⏸</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:['AIza','SyC5X5C0Uje6bCMzrvuUuq5Bz33ly0PR-vc'].join(''),
  authDomain:'ai-classroom-70a97.firebaseapp.com',
  databaseURL:'https://ai-classroom-70a97-default-rtdb.firebaseio.com',
  projectId:'ai-classroom-70a97',
  storageBucket:'ai-classroom-70a97.firebasestorage.app',
  appId:'1:160782638499:web:f3fb834ce32d643de28e16',
});
const db=firebase.database(),auth=firebase.auth();
let currentUser=null,roomId='',sections=[],currentIdx=0;

auth.onAuthStateChanged(user=>{
  currentUser=user;
  if(user){document.getElementById('loginScreen').style.display='none';document.getElementById('setupScreen').classList.remove('hidden')}
  else{document.getElementById('loginScreen').style.display='flex';document.getElementById('setupScreen').classList.add('hidden')}
});
function googleLogin(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert(e.message))}

function enterRemote(){
  roomId=document.getElementById('inputRoom').value.trim();
  if(!roomId){alert('請輸入房間代碼');return}
  db.ref(`rooms/${roomId}/config`).once('value').then(s=>{
    if(!s.exists()){alert('找不到房間');return}
    const c=s.val();
    if(c.hostUid&&c.hostUid!==currentUser.uid){alert('你不是這個房間的老師');return}
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('remote').classList.add('active');
    document.getElementById('rRoom').textContent=c.title||roomId;
    startRemote();
  });
}

function startRemote(){
  // Listen for presentation sections (written by the presentation page)
  db.ref(`rooms/${roomId}/presentation`).on('value',s=>{
    const d=s.val();
    if(!d||!d.sections)return;
    sections=d.sections;
    currentIdx=d.current||0;
    renderSections();
  });
  // Listen mode
  db.ref(`rooms/${roomId}/config/mode`).on('value',s=>{
    const m=s.val()||'wall';
    document.querySelectorAll('.r-mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  });
}

function renderSections(){
  const el=document.getElementById('rSections');
  el.innerHTML=sections.map((s,i)=>`<div class="r-sec${i===currentIdx?' current':''}" onclick="slideGoto(${i})"><div class="idx">${i+1}</div><div class="title">${s.title||s.id}</div></div>`).join('');
  document.getElementById('rCurrent').textContent=sections[currentIdx]?.title||'-';
  document.getElementById('rCounter').textContent=`${currentIdx+1} / ${sections.length}`;
}

function slideNav(dir){
  const next=currentIdx+dir;
  if(next<0||next>=sections.length)return;
  slideGoto(next);
}

function slideGoto(idx){
  currentIdx=idx;
  db.ref(`rooms/${roomId}/slideControl`).set({action:'goto',index:idx,ts:firebase.database.ServerValue.TIMESTAMP});
  db.ref(`rooms/${roomId}/presentation/current`).set(idx);
  renderSections();
}

function setMode(m){db.ref(`rooms/${roomId}/config/mode`).set(m)}
</script>
</body>
</html>
