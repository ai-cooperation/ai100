<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#0B3C5D"/><rect x="0" y="0" width="1920" height="6" fill="#FFC857"/><text x="120" y="120" fill="#FFC857" font-size="48" font-weight="bold" font-family="sans-serif">語音驅動</text><text x="120" y="200" fill="#D4F0EB" font-size="28" font-family="sans-serif">老師說話就是操作 — 不需要碰螢幕</text><rect x="120" y="280" width="1680" height="120" rx="12" fill="#134B6E"/><text x="160" y="330" fill="#FFC857" font-size="22" font-family="sans-serif">🎤</text><text x="200" y="330" fill="rgba(255,255,255,0.7)" font-size="22" font-family="sans-serif">「我們來投票，問題是 AI 會取代工程師嗎？選項有完全取代、部分取代、不會」</text><text x="200" y="370" fill="#0F9D8A" font-size="18" font-family="sans-serif">→ Agent 解析 → 建立投票 → 推送學員手機 → 投影機顯示即時結果（&lt; 2 秒）</text><rect x="120" y="440" width="800" height="80" rx="12" fill="#134B6E"/><text x="160" y="490" fill="#FFC857" font-size="22" font-family="sans-serif">🎤</text><text x="200" y="490" fill="rgba(255,255,255,0.7)" font-size="22" font-family="sans-serif">「下一頁」→ 即時換頁（&lt; 50ms）</text><rect x="120" y="560" width="800" height="80" rx="12" fill="#134B6E"/><text x="160" y="610" fill="#FFC857" font-size="22" font-family="sans-serif">🎤</text><text x="200" y="610" fill="rgba(255,255,255,0.7)" font-size="22" font-family="sans-serif">「出一題考他們」→ AI 根據內容自動出題</text><rect x="120" y="680" width="800" height="80" rx="12" fill="#134B6E"/><text x="160" y="730" fill="#FFC857" font-size="22" font-family="sans-serif">🎤</text><text x="200" y="730" fill="rgba(255,255,255,0.7)" font-size="22" font-family="sans-serif">「暖場一下」→ AI 發起文字雲互動</text></svg>
